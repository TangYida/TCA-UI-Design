<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Account Settings — Redesign</title><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/site.css"><link rel="stylesheet" href="../css/masters.css"></head><body><header data-site-header></header><main class="shell"><section class="page-hero"><div class="eyebrow">Personal center</div><h1 class="display">Your account</h1></section><section class="settings"><nav class="settings-nav"><button>Profile</button><button>Membership</button><button>Saved articles</button><button>Course progress</button><button>Newsletters</button><button>Security</button></nav><div class="settings-panel"><div class="kicker">Profile</div><h2 class="display settings-heading">Account details</h2><div class="field"><label for="name">Display name</label><input id="name" value="Reader"></div><div class="field"><label for="email">Email</label><input id="email" type="email" value="reader@example.com"></div><div class="field"><label for="region">Country / Region</label><select id="region"><option>China</option><option>United Kingdom</option><option>United States</option></select></div><div class="field"><label for="language">Language preference</label><select id="language"><option>English</option><option>中文</option></select></div><button class="button primary">Save changes</button></div></section></main><footer data-site-footer></footer><script src="../js/site.js"></script></body></html>
