<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Topic — The China Academy</title>
  <meta name="description" content="Browse all articles and videos for a topic from The China Academy.">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/site.css">
  <link rel="stylesheet" href="../css/masters.css">
</head>
<body class="master-section tag-archive-page" data-page="tag">
<header data-site-header></header>
<main class="section-page">
  <header class="section-mast tag-archive-mast">
    <div class="section-title-row"><h1 class="section-title" data-tag-title>Topic</h1></div>
  </header>
  <div class="section-sort tag-archive-sort" role="group" aria-label="Sort topic content">
    <span>Sort by</span>
    <button class="active" type="button" data-tag-sort="latest" aria-pressed="true">Latest</button>
    <button type="button" data-tag-sort="popular" aria-pressed="false">Popular</button>
  </div>

  <section class="section-board tag-archive-board" data-tag-board aria-label="Topic content">
    <div class="section-card-grid" data-tag-grid></div>
    <p class="section-empty" data-tag-empty hidden></p>
    <div class="section-load-row"><button class="section-load-more" type="button" data-tag-load-more>Load More</button></div>
  </section>
</main>
<footer data-site-footer></footer>
<script src="../js/site.js"></script>
<script src="../js/tag.js"></script>
</body>
</html>
